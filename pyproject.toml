[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tex2docx-engine"
version = "0.3.0"
description = "LaTeX to DOCX conversion that runs the real TeX engine, then grafts the measured PDF layout onto the DOCX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Azsig" }]
keywords = ["latex", "docx", "word", "tex4ht", "make4ht", "pdf", "conversion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: XML",
]

# Dependensi runtime: NOL — murni stdlib.
# Butuh program eksternal: texlive+make4ht, libreoffice, poppler-utils (pdftotext).

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tex2docx = "tex2docx_engine.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tex2docx_engine = ["*.cfg"]
