% t2dcfg.cfg — tex2docx-engine: baca semantik LaTeX secara NATIVE lewat tex4ht.
%
% make4ht mode ODT (ooffice.4ht) membuang \vspace/\vskip/\\[X]/\centering —
% maknanya lalu "dinebak" ulang oleh oracle PDF (graft.py). Config ini membuat
% tex4ht MEMANCARKAN semantik itu sebagai komentar marker XML di titik kejadian:
%
%   <!--t2dvs:14.2pt-->       jarak vertikal (\vspace, \vskip, \bigskip, \\[X])
%   <!--t2dalign:center-->    scope perataan ON  (\centering/\raggedright/\raggedleft)
%   <!--t2dalign:end-->       scope perataan OFF (\aftergroup — group/env selesai)
%   <!--t2dbrk-->             \newpage/\clearpage/\cleardoublepage
%
% fix_odt.py (Python) mengubah marker -> automatic style ODT (fo:margin-top,
% fo:text-align, fo:break-before) SEBELUM LibreOffice. Judul bab: tex4ht
% MENGGANTI \chapter sehingga macro kepala kelas tak pernah jalan — niat
% perataan kelas dibaca dari \meaning head macro, lalu Heading-1 diterbitkan
% ulang dengan fo:text-align.
%
% Dimuat via: TEXINPUTS=<dir paket>: make4ht -f odt -c t2dcfg <main>.tex
% (tex4ht.sty meng-\input file ini saat memproses opsi, sebelum body).
%
% CATATAN PENULISAN: '@' bukan huruf di konteks cfg — semua macro kernel
% bertanda @ dipakai di bawah payung \makeatletter, dan catcode dipulihkan
% SEBELUM \EndPreamble agar body dokumen user tak ikut berubah tokenisasinya.
% Nilai ukuran masuk \HCode lewat \edef + \noexpand\HCode agar terekspansi.

\Preamble{ooffice}
\makeatletter

% '%' literal untuk nilai style (idiom tex4ht.sty:1095). Nama asli tex4ht
% '\prcnt:ch' tak bisa ditulis di cfg — ':' bukan letter di konteks cfg
% (hanya di file .4ht), '\prcnt:ch' terpecah jadi \prcnt + ':ch'.
\begingroup
  \catcode`\%=12
  \gdef\tdpct{%}
\endgroup

% ---------- util: pemancar marker sadar-mode ----------
% vmode (antar paragraf): tutup paragraf dulu (idiom ooffice.4ht), marker
%   jatuh DI ANTARA blok — posisi yang dibaca fix_odt.
% hmode (dalam paragraf, mis. \\[X]): marker inline — sengaja dibiarkan,
%   fix_odt membuangnya (jarak antar-baris dalam satu paragraf tak
%   terrepresentasikan di Word; dibatasi di v1).
\newdimen\tddimen
\def\tdmark#1{%
  \edef\tdtmp{%
    \noexpand\ifhmode
      \noexpand\HCode{<!--t2d#1-->}%
    \noexpand\else
      \noexpand\IgnorePar\noexpand\EndP
      \noexpand\HCode{<!--t2d#1-->}%
      \noexpand\par\noexpand\ShowPar
    \noexpand\fi}%
  \tdtmp}

% ---------- 1. \vspace / \vspace* / \bigskip / \medskip / \smallskip / \\[X] ----------
% Hook resmi tex4ht (latex.4ht): menerima PANJANG di #1. \\[X] diarahkan ke
% sini oleh \@newline. \setlength menerima ekspresi & nilai negatif.
\def\tdvsl#1{%
  \setlength{\tddimen}{#1}%
  \edef\tdtmp{\noexpand\tdmark{vs:\the\tddimen}}%
  \tdtmp}
\Configure{vspace}{\tdvsl{#1}}

% ---------- 2. \vskip primitif (banyak dipakai cls di front matter) ----------
% Tidak ada hook tex4ht — intercept dengan afterassignment: glue discan penuh
% (termasuk plus/minus) ke skip register, lalu emitter jalan. Glue aslinya
% memang dibuang mode ODT, jadi tak ada layout yang berubah. Dipasang SETELAH
% \begin{document} agar internal tex4ht di preamble tetap memakai primitif.
%
% DISPATCH \ifinner WAJIB sebelum scan (terverifikasi empiris): output routine
% kernel LaTeX 2020+ memakai \vskip dengan idiom glue l3 yang tak tercerna
% scan register kita ("\group_begin:" -> Missing number). Situs itu selalu di
% mode vertikal INTERNAL (\ifinner true; \vbox output) — pulangkan ke primitif
% asli. Body dokumen user selalu mode eksternal (vmode sesudah \par) dan glue
% user selalu literal -> aman discan. Tanpa dispatch: exit!=0 di tiap shipout.
\newskip\tdskip
\def\tdvskipemit{%
  \edef\tdtmp{\noexpand\tdmark{vs:\the\tdskip}}%
  \tdtmp}
\def\tdvskipdispatch{%
  \ifinner
    \expandafter\tdorigvskip
  \else
    \expandafter\tdvskipscan
  \fi}
\def\tdvskipscan{\afterassignment\tdvskipemit\tdskip}

% ---------- 3. \\ (patah baris polos) ----------
% ooffice.4ht tak pernah men-set \Configure{newline} -> \\ hilang di ODT.
\Configure{newline}{\HCode{<text:line-break/>}}

% ---------- 4. scope perataan: \centering / \raggedright / \raggedleft ----------
% \aftergroup menutup scope saat group/environment ({...}, figure, table,
% titlepage) berakhir — scope kira-kira sejajar dengan blok yang diratakan.
\def\tdalignmark#1{%
  \tdmark{align:#1}%
  \aftergroup\tdalignend}
\def\tdalignend{\tdmark{align:end}}

\let\tdorigcentering\centering
\gdef\centering{\tdalignmark{center}\tdorigcentering}
\let\tdorigraggedright\raggedright
\gdef\raggedright{\tdalignmark{left}\tdorigraggedright}
\let\tdorigraggedleft\raggedleft
\gdef\raggedleft{\tdalignmark{right}\tdorigraggedleft}

% ---------- 5. perataan judul bab dari macro kepala kelas ----------
% tex4ht mengganti \chapter -> \@makechapterhead/\@makeschapterhead kelas tak
% pernah dieksekusi; \centering di dalamnya hilang struktural. Niat kelas
% dibaca dari \meaning macro (token \centering dsb. tertanam teks di definisi).
\def\tdheadalign#1{% #1 = token control sequence (mis. \@makechapterhead)
  \edef\tdmean{\meaning#1}%
  \edef\tdcall{\noexpand\in@{\string\centering}{\tdmean}}\tdcall
  \ifin@ \def\tdalign{center}\else
    \edef\tdcall{\noexpand\in@{\string\raggedright}{\tdmean}}\tdcall
    \ifin@ \def\tdalign{left}\else
      \edef\tdcall{\noexpand\in@{\string\raggedleft}{\tdmean}}\tdcall
      \ifin@ \def\tdalign{right}\else
        \edef\tdcall{\noexpand\in@{\string\raggedcentre}{\tdmean}}\tdcall
        \ifin@ \def\tdalign{center}\fi
      \fi
    \fi
  \fi}

% Terbitkan ulang \ConfigureOO{Heading-1} default ooffice.4ht + fo:text-align
% (akumulator style diekspansi di akhir dokumen -> override cfg menang).
% fo:text-align TIDAK ada di default -> kehadirannya di styles.xml = sinyal
% "ditanam engine" yang dibaca fix_odt untuk meng-hardkan tiap text:h.
\def\tdsetheading#1#2{%
  \ConfigureOO{#1}{\Hnewline
<style:style style:name="#1" style:family="paragraph"
   style:parent-style-name="Heading" style:next-style-name="Text-body"
   style:class="text">\Hnewline
<style:paragraph-properties fo:font-size="17.2999992370605pt"
   fo:font-weight="bold" style:font-size-asian="115\tdpct"
   style:font-weight-asian="bold" style:font-size-complex="115\tdpct"
   style:font-weight-complex="bold" fo:margin-top="40pt" fo:margin-bottom="25pt"
   fo:text-align="#2"/>\Hnewline
</style:style>}}

% ---------- 6. \newpage / \clearpage / \cleardoublepage ----------
% ooffice.4ht sudah menandai clearpage-per-chapter; \newpage eksplisit user
% (mis. pemisah halaman daftar) ditandai sendiri agar mode --no-pdf tetap
% punya break selain awal bab.
\let\tdorignewpage\newpage
\gdef\newpage{\tdmark{brk}\tdorignewpage}
\let\tdorigclearpage\clearpage
\gdef\clearpage{\tdmark{brk}\tdorigclearpage}
\let\tdorigcleardoublepage\cleardoublepage
\gdef\cleardoublepage{\tdmark{brk}\tdorigcleardoublepage}

\begin{document}

% memoir-hook yang dipanggil beberapa cls tapi tak selalu terdefinisi di bawah
% tex4ht — sumber exit!=0 yang bisa dipulihkan.
\providecommand{\insertchapterspace}{}

% pasang intercept \vskip (lihat catatan bagian 2 — dispatch \ifinner).
\let\tdorigvskip\vskip
\def\vskip{\tdvskipdispatch}

% perataan Heading-1: dari macro kepala kelas; override eksplisit via opsi
% latex preamble '\let\tdheadoverride\centering' bila scan meleset.
% (Pembanding = salinan ASLI tdorig*: \let user di preamble berjalan SEBELUM
% cfg membungkus \centering, jadi \ifx terhadap \centering baru tak pernah
% sama. Tanpa \expandafter — itu akan mengeksekusi wrapper justru di sini.)
\ifx\tdheadoverride\undefined
  \def\tdalign{}%
  \expandafter\ifx\csname @makechapterhead\endcsname\relax\else
    \expandafter\tdheadalign\csname @makechapterhead\endcsname
  \fi
  \ifx\tdalign\empty
    \expandafter\ifx\csname @makeschapterhead\endcsname\relax\else
      \expandafter\tdheadalign\csname @makeschapterhead\endcsname
    \fi
  \fi
  \ifx\tdalign\empty\else \tdsetheading{Heading-1}{\tdalign} \fi
\else
  \ifx\tdheadoverride\tdorigcentering \tdsetheading{Heading-1}{center}\fi
  \ifx\tdheadoverride\tdorigraggedright \tdsetheading{Heading-1}{left}\fi
  \ifx\tdheadoverride\tdorigraggedleft \tdsetheading{Heading-1}{right}\fi
\fi

\makeatother
\EndPreamble
