% t2dcfg.cfg — tex2docx-engine: baca semantik LaTeX secara NATIVE lewat tex4ht.
%
% make4ht mode ODT (ooffice.4ht) membuang \vspace/\vskip/\\[X]/\centering —
% maknanya lalu "dinebak" ulang oleh oracle PDF (graft.py). Config ini membuat
% tex4ht MEMANCARKAN semantik itu sebagai komentar marker XML di titik kejadian:
%
%   <!--t2dvs:14.2pt-->       jarak vertikal (\vspace, \vskip, \bigskip, \\[X])
%   <!--t2dalign:center-->    scope perataan ON  (\centering/\raggedright/\raggedleft)
%   <!--t2dalign:end-->       scope perataan OFF (\aftergroup — group/env selesai)
%   <!--t2dbrk-->             \newpage/\clearpage/\cleardoublepage
%
% fix_odt.py (Python) mengubah marker -> automatic style ODT (fo:margin-top,
% fo:text-align, fo:break-before) SEBELUM LibreOffice. Judul bab: tex4ht
% MENGGANTI \chapter sehingga macro kepala kelas tak pernah jalan — niat
% perataan kelas dibaca dari \meaning head macro, lalu Heading-1 diterbitkan
% ulang dengan fo:text-align.
%
% Dimuat via: TEXINPUTS=<dir paket>: make4ht -f odt -c t2dcfg <main>.tex
% (tex4ht.sty meng-\input file ini saat memproses opsi, sebelum body).
%
% CATATAN PENULISAN: '@' bukan huruf di konteks cfg — semua macro kernel
% bertanda @ dipakai di bawah payung \makeatletter, dan catcode dipulihkan
% SEBELUM \EndPreamble agar body dokumen user tak ikut berubah tokenisasinya.
% Nilai ukuran masuk \HCode lewat \edef + \noexpand\HCode agar terekspansi.

\Preamble{ooffice}
\makeatletter

% '%' literal untuk nilai style (idiom tex4ht.sty:1095). Nama asli tex4ht
% '\prcnt:ch' tak bisa ditulis di cfg — ':' bukan letter di konteks cfg
% (hanya di file .4ht), '\prcnt:ch' terpecah jadi \prcnt + ':ch'.
\begingroup
  \catcode`\%=12
  \gdef\tdpct{%}
\endgroup

% ---------- util: pemancar marker (special MENTAH) ----------
% \HCode (tex4ht.sty:929) memuat \ifvmode\leavevmode\fi — ia MEMULAI
% paragraf setiap dipanggil di vmode. Di titik \vskip INTERNAL LaTeX
% (pembukaan list \vskip\topsep, \endtrivlist, ...) leavevmode itu
% merusak state \if@inlabel list -> "Something's wrong--perhaps a
% missing \item" massal (23 di prakata skripsi, 76 di dokumen penuh;
% terverifikasi lewat bisect cfg: intercept \vskip + marker = error,
% intercept tanpa marker = bersih). Kaskade lanjutannya: thebibliography
% gagal dimulai -> "Missing }" di \end{thebibliography} -> .4oo
% unbalanced -> heal domfilter -> ODF korup -> LibreOffice berhenti
% impor di tengah dokumen.
% Solusi: \ht:special MENTAH — payload DVI identik dengan \HCode
% (t4ht memancarkannya ke .4oo sama persis), TANPA perubahan mode TeX
% sehingga state LaTeX tak tersentuh. Guard \EndPicture dipertahankan
% (di dalam \Picture marker tak bermakna).
% Nama berkoma ':' tak bisa ditulis di konteks cfg — bungkus dalam
% grup catcode, idiom sama dengan \tdpct di atas.
\begingroup
  \catcode`\:=11
  \gdef\tdrawmark#1{\ifx \EndPicture\:UnDef
    \ht:special{t4ht=#1}\fi}
\endgroup
\newdimen\tddimen
\def\tdmark#1{%
  \edef\tdtmp{\noexpand\tdrawmark{<!--t2d#1-->}}%
  \tdtmp}

% ---------- 7. ukuran gambar dari LaTeX (width/height/scale graphicx) ----------
% Mode DVI tanpa .xbb membuat \if:boundingbox false: ooffice.4ht menulis
% ukuran PIKSEL mentah gambar sebagai pt (logo yang diperintahkan 5.5cm
% tercatat 414pt=14.6cm; width=0.7\linewidth tercatat 1600pt=56cm) —
% polish.py tak punya cara membedakan logo dari gambar isi resolusi tinggi.
% LaTeX sendiri TAHU ukuran akhirnya saat key Gin dievaluasi. Dimen + flag
% dicatat key handler (call-through ke handler asli \KV@Gin@* agar
% perhitungan graphicx utuh), dipancarkan pembungkus \Ginclude@graphics
% sebagai marker tepat sebelum <draw:frame>; fix_odt menulis ulang
% svg:width/height frame dengannya. Berlaku semua format gambar; nilai
% panjang dievaluasi LaTeX (\textwidth di subfigure = lebar lokalnya).
\newdimen\tddimgw
\newdimen\tddimgh
\gdef\tddhasw{0}%
\gdef\tddhash{0}%
\gdef\tddscale{1}%

% ---------- 1. \vspace / \vspace* / \bigskip / \medskip / \smallskip / \\[X] ----------
% Hook resmi tex4ht (latex.4ht): menerima PANJANG di #1. \\[X] diarahkan ke
% sini oleh \@newline. \setlength menerima ekspresi & nilai negatif.
\def\tdvsl#1{%
  \setlength{\tddimen}{#1}%
  \edef\tdtmp{\noexpand\tdmark{vs:\the\tddimen}}%
  \tdtmp}
\Configure{vspace}{\tdvsl{#1}}

% ---------- 2. \vskip primitif (banyak dipakai cls di front matter) ----------
% Tidak ada hook tex4ht — intercept dengan afterassignment: glue discan penuh
% (termasuk plus/minus) ke skip register, lalu emitter jalan. Glue aslinya
% memang dibuang mode ODT, jadi tak ada layout yang berubah. Dipasang SETELAH
% \begin{document} agar internal tex4ht di preamble tetap memakai primitif.
%
% DISPATCH \ifinner WAJIB sebelum scan (terverifikasi empiris): output routine
% kernel LaTeX 2020+ memakai \vskip dengan idiom glue l3 yang tak tercerna
% scan register kita ("\group_begin:" -> Missing number). Situs itu selalu di
% mode vertikal INTERNAL (\ifinner true; \vbox output) — pulangkan ke primitif
% asli. Body dokumen user selalu mode eksternal (vmode sesudah \par) dan glue
% user selalu literal -> aman discan. Tanpa dispatch: exit!=0 di tiap shipout.
\newskip\tdskip
\def\tdvskipemit{%
  \edef\tdtmp{\noexpand\tdmark{vs:\the\tdskip}}%
  \tdtmp
  \tdorigvskip\the\tdskip}   % glue ASLI tetap diterapkan — marker tak
                             % boleh mengubah layout DVI (t4ht memakannya
                             % untuk deteksi blok; mengubahnya merusak XML).
\def\tdvskipdispatch{%
  \ifinner
    \expandafter\tdorigvskip
  \else
    \expandafter\tdvskipscan
  \fi}
\def\tdvskipscan{\afterassignment\tdvskipemit\tdskip}

% ---------- 3. \\ (patah baris polos) ----------
% ooffice.4ht tak pernah men-set \Configure{newline} -> \\ hilang di ODT.
\Configure{newline}{\HCode{<text:line-break/>}}

% ---------- 4. scope perataan: \centering / \raggedright / \raggedleft ----------
% \aftergroup menutup scope saat group/environment ({...}, figure, table,
% titlepage) berakhir — scope kira-kira sejajar dengan blok yang diratakan.
%
% END TANPA GUARD: era \HCode, end-marker di konteks internal (sel tabel,
% group float) merusak pelacakan nesting t4ht dan memotong dokumen — kini
% emitter memakai special MENTAH \ht:special yang inert terhadap mode TeX
% dan nesting XML, jadi end KELUAR DI SEMUA konteks. Itu wajib: menelan end
% (guard \ifinner/\ifhmode lama) meninggalkan scope terbuka — 18 scope
% bocor di skripsi uji, \centering kepala bab melumuri seluruh isi bab
% berikutnya (semua Heading-2 jadi center padahal kiri di PDF).
\def\tdalignmark#1{%
  \tdmark{align:#1}%
  \aftergroup\tdalignend}
\def\tdalignend{\tdmark{align:end}}

\let\tdorigcentering\centering
\gdef\centering{\tdalignmark{center}\tdorigcentering}
\let\tdorigraggedright\raggedright
\gdef\raggedright{\tdalignmark{left}\tdorigraggedright}
\let\tdorigraggedleft\raggedleft
\gdef\raggedleft{\tdalignmark{right}\tdorigraggedleft}

% ---------- 5. perataan judul bab dari macro kepala kelas ----------
% tex4ht mengganti \chapter -> \@makechapterhead/\@makeschapterhead kelas tak
% pernah dieksekusi; \centering di dalamnya hilang struktural. Niat kelas
% dibaca dari \meaning macro (token \centering dsb. tertanam teks di definisi).
\def\tdheadalign#1{% #1 = token control sequence (mis. \@makechapterhead)
  \edef\tdmean{\meaning#1}%
  \edef\tdcall{\noexpand\in@{\string\centering}{\tdmean}}\tdcall
  \ifin@ \def\tdalign{center}\else
    \edef\tdcall{\noexpand\in@{\string\raggedright}{\tdmean}}\tdcall
    \ifin@ \def\tdalign{left}\else
      \edef\tdcall{\noexpand\in@{\string\raggedleft}{\tdmean}}\tdcall
      \ifin@ \def\tdalign{right}\else
        \edef\tdcall{\noexpand\in@{\string\raggedcentre}{\tdmean}}\tdcall
        \ifin@ \def\tdalign{center}\fi
      \fi
    \fi
  \fi}

% Terbitkan ulang \ConfigureOO{Heading-N} dari STATUS FONT NFSS LaTeX yang
% DI-PROBE — bukan hardcode. Kernel NFSS menyimpan font aktif di \f@size/
% \f@series/\f@shape setiap \large/\normalsize/\bfseries/\itshape dieksekusi,
% dan tex4ht TIDAK menghapus \@makechapterhead (\chapter) maupun argumen ke-6
% \@startsection (\section/subsection/subsubsection) milik kelas — jadi
% ukuran/bold/miring tiap level judul dibaca dari .cls apa adanya (kelas
% lain: 16pt bab, subsection miring, otomatis mengikuti). Style diterbitkan
% dengan <style:text-properties> (tempat sah atribut font per skema ODF —
% dulu ooffice.4ht menaruhnya di paragraph-properties dan LibreOffice
% mengabaikannya). fo:text-align TIDAK ada di default -> kehadirannya di
% styles.xml = sinyal "ditanam engine" yang dibaca fix_odt.
\def\td-b{b}\def\td-bx{bx}\def\td-it{it}\def\td-sl{sl}%

\def\tdemitheading#1#2#3#4#5{% #1=style, #2=size, #3=series, #4=shape, #5=align
  \def\tdwt{normal}%
  \ifx#3\td-b \def\tdwt{bold}\fi
  \ifx#3\td-bx \def\tdwt{bold}\fi
  \def\tdst{normal}%
  \ifx#4\td-it \def\tdst{italic}\fi
  \ifx#4\td-sl \def\tdst{italic}\fi
  \ConfigureOO{#1}{\Hnewline
<style:style style:name="#1" style:family="paragraph"
   style:parent-style-name="Heading" style:next-style-name="Text-body"
   style:class="text">\Hnewline
<style:paragraph-properties
   \ifx#5\empty\else fo:text-align="#5"\fi/>\Hnewline
<style:text-properties fo:font-size="#2" style:font-size-asian="#2"
   style:font-size-complex="#2" fo:font-weight="\tdwt"
   style:font-weight-asian="\tdwt" style:font-weight-complex="\tdwt"
   fo:font-style="\tdst" style:font-style-asian="\tdst"
   style:font-style-complex="\tdst"/>\Hnewline
</style:style>}}

% Probe \chapter: jalankan \@makechapterhead (atau versi bintang) di dalam
% \setbox0 — tidak mencetak apa pun; \MakeUppercase dinetralkan agar probe
% (berisi \xdef) tidak di-upper-kan. \xdef MEMBUANG ekspansi \f@size dsb.
% sehingga \ifx pembanding makro-literal bekerja di \tdemitheading.
\def\tdprobechap#1{%
  \begingroup
    \def\MakeUppercase##1{##1}%
    \setbox0=\vbox{%
      #1{%
        \xdef\tdfsize{\f@size pt}%
        \xdef\tdfseries{\f@series}%
        \xdef\tdfshape{\f@shape}%
      }%
    }%
  \endgroup}

% Probe \section/\subsection/\subsubsection: \@startsection diredefinisi
% LOKAL agar argumen ke-6 (makro style kepala kelas, mis. \large\bfseries)
% diterapkan di vbox probe — kelas yang tak berbasis \@startsection membiarkan
% \tdfsize kosong -> style level itu tak diterbitkan (fallback ooffice.4ht +
% pembersih fix_odt yang jalan).
\def\tdprobesec#1#2{%
  \begingroup
    \gdef\tdfsize{}%
    \def\@startsection##1##2##3##4##5##6{%
      \setbox0=\vbox{%
        \normalfont\normalsize ##6\relax
        \xdef\tdfsize{\f@size pt}%
        \xdef\tdfseries{\f@series}%
        \xdef\tdfshape{\f@shape}%
      }%
    }%
    #1%
  \endgroup
  \ifx\tdfsize\empty\else
    \def\tdnoalign{}%
    \tdemitheading{#2}{\tdfsize}{\tdfseries}{\tdfshape}{\tdnoalign}%
  \fi}

% ---------- 6. \newpage / \clearpage / \cleardoublepage ----------
% ooffice.4ht sudah menandai clearpage-per-chapter; \newpage eksplisit user
% (mis. pemisah halaman daftar) ditandai sendiri agar mode --no-pdf tetap
% punya break selain awal bab.
\let\tdorignewpage\newpage
\gdef\newpage{\tdmark{brk}\tdorignewpage}
\let\tdorigclearpage\clearpage
\gdef\clearpage{\tdmark{brk}\tdorigclearpage}
\let\tdorigcleardoublepage\cleardoublepage
\gdef\cleardoublepage{\tdmark{brk}\tdorigcleardoublepage}

\begin{document}

% memoir-hook yang dipanggil beberapa cls tapi tak selalu terdefinisi. (Di sini
% = AtBeginDocument, SETELAH kelas termuat — untuk skripsidtntf.cls:151 yang
% \renewcommand atas perintah belum-terdefinisi error "recoverable" tetap
% muncul saat \documentclass; memindahkan provide ke atas cfg JUGA tak bisa:
% doc berbasis memoir akan bentrok \newcommand. Biarkan sebagai noise jinak.)
\providecommand{\insertchapterspace}{}

% pasang intercept \vskip (lihat catatan bagian 2 — dispatch \ifinner).
\let\tdorigvskip\vskip
\def\vskip{\tdvskipdispatch}

% hook ukuran gambar (bagian 7). Di \begin{document}: graphicx (dan
% \KV@Gin@* + \Ginclude@graphics) pasti sudah termuat bila dokumen
% memakai \includegraphics; dokumen tanpa graphicx lewati tanpa marker.
\ifx\KV@Gin@width\undefined\else
  \let\tdorigKVw\KV@Gin@width
  \define@key{Gin}{width}{\tdorigKVw{#1}\setlength{\tddimgw}{#1}\gdef\tddhasw{1}}%
  \let\tdorigKVh\KV@Gin@height
  \define@key{Gin}{height}{\tdorigKVh{#1}\setlength{\tddimgh}{#1}\gdef\tddhash{1}}%
  \let\tdorigKVs\KV@Gin@scale
  \define@key{Gin}{scale}{\tdorigKVs{#1}\gdef\tddscale{#1}}%
  \let\tdorigGinclude\Ginclude@graphics
  \def\Ginclude@graphics#1{%
    \tdmark{img:hasw=\tddhasw,w=\the\tddimgw,hash=\tddhash,h=\the\tddimgh,scale=\tddscale}%
    \tdorigGinclude{#1}%
    \gdef\tddhasw{0}\gdef\tddhash{0}\gdef\tddscale{1}}
\fi

% perataan Heading-1: dari macro kepala kelas; override eksplisit via opsi
% latex preamble '\let\tdheadoverride\centering' bila scan meleset.
% (Pembanding = salinan ASLI tdorig*: \let user di preamble berjalan SEBELUM
% cfg membungkus \centering, jadi \ifx terhadap \centering baru tak pernah
% sama. Tanpa \expandafter — itu akan mengeksekusi wrapper justru di sini.)
\ifx\tdheadoverride\undefined
  \def\tdalign{}%
  \expandafter\ifx\csname @makechapterhead\endcsname\relax\else
    \expandafter\tdheadalign\csname @makechapterhead\endcsname
  \fi
  \ifx\tdalign\empty
    \expandafter\ifx\csname @makeschapterhead\endcsname\relax\else
      \expandafter\tdheadalign\csname @makeschapterhead\endcsname
    \fi
  \fi
\else
  \ifx\tdheadoverride\tdorigcentering \def\tdalign{center}\fi
  \ifx\tdheadoverride\tdorigraggedright \def\tdalign{left}\fi
  \ifx\tdheadoverride\tdorigraggedleft \def\tdalign{right}\fi
\fi

% Terbitkan Heading-1..4 dari probe NFSS (\f@size/\f@series/\f@shape kelas):
% Heading-1 dari kepala bab (align = hasil scan di atas), Heading-2..4 dari
% argumen ke-6 \@startsection. Kelas tanpa bab: probe jatuh ke
% \@makeschapterhead; tak ada keduanya (article) -> \tdfsize tetap kosong
% dan tak ada yang diterbitkan (fallback ooffice.4ht + pembersih fix_odt).
\def\tdfsize{}%
\expandafter\ifx\csname @makechapterhead\endcsname\relax
  \expandafter\ifx\csname @makeschapterhead\endcsname\relax\else
    \expandafter\tdprobechap\csname @makeschapterhead\endcsname
  \fi
\else
  \expandafter\tdprobechap\csname @makechapterhead\endcsname
\fi
\ifx\tdfsize\empty\else
  \tdemitheading{Heading-1}{\tdfsize}{\tdfseries}{\tdfshape}{\tdalign}%
\fi
\tdprobesec{\section}{Heading-2}%
\tdprobesec{\subsection}{Heading-3}%
\tdprobesec{\subsubsection}{Heading-4}%

\makeatother
\EndPreamble
